name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    name: Lint
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop
      - name: Verify gem builds
        run: gem build phlex-reactive.gemspec --strict

  test:
    runs-on: ubuntu-26.04
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4"
          - "4.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Unit + request + generator specs
        run: bundle exec rspec spec/phlex spec/requests spec/generators

  bench:
    runs-on: ubuntu-26.04
    name: Benchmarks (report only)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Run + report: this job NEVER fails the build on a perf regression
      # (continue-on-error). It exists to surface throughput/allocation trends
      # over time as an artifact, not to gate merges on a flaky threshold (shared
      # CI runners are too noisy for a hard cutoff). Read the numbers on the PR.
      - name: Micro-benchmarks
        id: micro
        continue-on-error: true
        run: bundle exec rake bench:micro
      - name: Request-cycle benchmark (derailed)
        continue-on-error: true
        run: bundle exec rake bench:request | tee tmp/benchmarks/request.txt
      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmarks
          path: tmp/benchmarks/*.txt
          if-no-files-found: warn

  site:
    runs-on: ubuntu-26.04
    name: Demo site (${{ matrix.server }})
    # The docs/ Rails app is a separate app that dogfoods the gem via
    # `path: ".."`. Run its request + system suites under BOTH real servers,
    # plus its RuboCop, so the showcase can't rot. `rake lint` is used (not bare
    # `rubocop`) because the gem's ancestor .rubocop.yml excludes docs/**/* — a
    # bare run would lint zero files.
    strategy:
      fail-fast: false
      matrix:
        server:
          - puma
          - falcon
    defaults:
      run:
        working-directory: docs
    env:
      RAILS_ENV: test
      HEADLESS: "true"
      CAPYBARA_SERVER: ${{ matrix.server }}
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      # The app depends on the gem via `path: ".."`, and the gem's gemspec lists
      # files with `git ls-files`. Every commit changes that file list, so the
      # path-gem's gemspec digest never matches a previously-committed lock —
      # which makes bundler's frozen/deployment mode (forced by bundler-cache)
      # fail with "the gemspecs for path gems changed". Disable frozen for this
      # app; the lock is still respected, just allowed to update the path entry.
      BUNDLE_FROZEN: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: docs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: docs-playwright-${{ runner.os }}-${{ hashFiles('docs/bun.lock') }}
          restore-keys: |
            docs-playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx --bun playwright install chromium chromium-headless-shell
      - name: Install Playwright system dependencies
        run: sudo bunx --bun playwright install-deps chromium 2>/dev/null || true
      - name: Prepare database
        run: bin/rails db:test:prepare
      - name: Build daisyUI/Tailwind CSS
        run: bun run build:css
      - name: RuboCop
        if: matrix.server == 'puma'
        run: bundle exec rake lint
      - name: Request specs
        run: bundle exec rspec spec/requests
      - name: System specs
        run: bundle exec rspec spec/system

  system:
    runs-on: ubuntu-26.04
    name: System (${{ matrix.server }} / ${{ matrix.transport }})
    # Run the browser suite across TWO real servers × TWO transports (issue #187):
    #   server:    puma (sync, thread-pool) | falcon (async, fiber-per-request)
    #   transport: cable (Action Cable, SQLite) | pgbus (Postgres SSE)
    # So a reactive round trip is proven transport-agnostic — the same specs pass
    # on both, and the pgbus cells additionally prove real cross-tab broadcast
    # delivery + actor-echo exclusion over live SSE (the :pgbus-tagged specs).
    # The falcon × pgbus cell is the one that matters most (async + streaming).
    strategy:
      fail-fast: false
      matrix:
        server:
          - puma
          - falcon
        transport:
          - cable
          - pgbus
    # A plain postgres:18 for the pgbus cells (pgbus vendors the PGMQ schema via
    # its own migrations — no extension image needed). It idles harmlessly for
    # the cable cells; TRANSPORT gates whether the dummy uses it.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phlex_reactive_pgbus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      HEADLESS: "true"
      CAPYBARA_SERVER: ${{ matrix.server }}
      TRANSPORT: ${{ matrix.transport }}
      # Read by spec/dummy/config/database.yml under TRANSPORT=pgbus (ignored on
      # the cable cells, which stay SQLite).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/phlex_reactive_pgbus_test
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: JS unit tests (client controller)
        # Transport-independent; run once (the cable/puma cell) to avoid 4× repeats.
        if: matrix.transport == 'cable'
        run: bun test spec/javascript
      - name: Minified client is in sync (drift guard)
        # The committed *.min.js/*.min.js.map must match a fresh build — the bun
        # minifier output is deterministic for ONE bun version, the one pinned in
        # .bun-version (build with that one: bun 1.4.0 prepends an unused require
        # shim to every module once any of them has a dynamic import(), 1.4.2
        # does not). So a rebuild that changes a tracked byte means someone
        # edited the source without running `rake build:js`, or built with
        # another bun. Runs only under one cell.
        if: matrix.server == 'puma' && matrix.transport == 'cable'
        run: bundle exec rake build:js_check
      - name: Prepare Postgres + pgbus schema
        # pgbus cells only: load the dummy's app schema into Postgres and install
        # the vendored PGMQ schema. pgbus is require:false, so PGBUS_PATH is unset
        # here (uses the released gem). rake task lives in the Rakefile (#187).
        if: matrix.transport == 'pgbus'
        run: bundle exec rake pgbus:prepare_test_db
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx --bun playwright install chromium chromium-headless-shell
      - name: Install Playwright system dependencies
        run: sudo bunx --bun playwright install-deps chromium 2>/dev/null || true
      - name: System specs
        run: bundle exec rspec spec/system
      - name: Upload failure screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: capybara-screenshots-${{ matrix.server }}-${{ matrix.transport }}
          path: spec/dummy/tmp/capybara/**/*.png
          if-no-files-found: ignore
