# conformance-kit's Tier 1 gate (zoolutions/phlex-reactive#363): it loads
# rubocop-thread_safety and turns every one of its cops on (Mutable-
# ClassInstanceVariable with EnforcedStyle: literals, LazySynchronization-
# Primitive). `bundle exec conformance-kit doctor` checks this line.
inherit_gem:
  conformance-kit: config/rubocop.yml

plugins:
  - rubocop-capybara
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  DisabledByDefault: false
  DisplayCopNames: true
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "**/node_modules/**/*"
    - "**/tmp/**/*"
    - "**/vendor/**/*"
    # The docs/ Rails app is a separate, deployable app with its own Gemfile and
    # RuboCop config (run `cd docs && rake lint`); it dogfoods the gem but is not
    # gem code.
    - "docs/**/*"
    - "spec/dummy/db/schema.rb"
    - "spec/dummy/bin/**/*"
    - "bin/**/*"

#===============
#=== LAYOUT ===
#===============

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/LineLength:
  Max: 125
  AllowHeredoc: true
  AllowURI: true
  AllowedPatterns:
    - '\A\s*#'
  Exclude:
    # Phlex components read top-to-bottom as markup; long attribute lines
    # (data:/class:/on(...)) are clearer on one line than wrapped.
    - spec/dummy/app/components/**/*.rb
    # The gemspec summary/description are fixed declarative strings — wrapping
    # them would only hurt readability.
    - "*.gemspec"

#===============
#=== LINT ===
#===============

Lint/MissingSuper:
  Exclude:
    # Phlex components override #initialize without calling super (Phlex's base
    # #initialize is a no-op); the dummy components and inline spec components
    # follow that idiom.
    - spec/**/*.rb

Lint/UnusedMethodArgument:
  Exclude:
    # Dummy components declare action params (matching the param schema /
    # name-binding under test) that an individual action may not persist.
    - spec/dummy/app/components/**/*.rb

#====================
#=== THREAD SAFETY ===
#====================

# Every rubocop-thread_safety cop is on (conformance-kit's config, above), and
# none is excluded for a file or a directory: class-level state that is
# deliberate carries an inline disable with the reason it is safe (the
# settings storage in lib/phlex/reactive.rb, the per-class render memos, the
# APM subscription). Anywhere else the cops fire.
ThreadSafety/NewThread:
  Exclude:
    # Specs that start threads on purpose, each to force the race the code
    # under test must survive (a Queue handshake or Thread.pass at the window).
    - spec/phlex/authorization_boot_instrumentation_spec.rb
    - spec/phlex/fragment_viewer_warned_spec.rb
    - spec/phlex/reactive/store_spec.rb
    # Concurrent renders must not interleave view-context buffers.
    - spec/phlex/reactive/streamable_view_context_spec.rb
    # The per-example watchdog (issue #320) runs on its own thread, so it can
    # fail an example whose server wedged.
    - spec/system/support/example_timeout.rb

#===============
#=== METRICS ===
#===============

Metrics:
  Enabled: false

#===============
#===  NAMING ===
#===============

Naming/BlockForwarding:
  Enabled: false

Naming/FileName:
  Exclude:
    # Conventional gem entrypoint: `require "phlex-reactive"` loads this file,
    # so it must be named with the hyphenated gem name, not snake_case.
    - lib/phlex-reactive.rb

Naming/MethodParameterName:
  AllowedNames:
    - id
    - c
    - n
    - s
    - p
    - to
    - as
    - "on"
    # Draggable regions (issue #416): an action receives a box as x/y/width/height.
    - x
    - "y"

Naming/VariableNumber:
  Exclude:
    - spec/**/*.rb

#=============
#=== RSpec ===
#=============

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NestedGroups:
  Max: 5

RSpec/ContextWording:
  Prefixes:
    - and
    - as
    - for
    - if
    - in
    - "on"
    - or
    - unless
    - when
    - with
    - without

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

# Stubbing a component instance's render to RAISE (the defer job's failure
# handling, issue #165) is the natural way to exercise a render-time error;
# there is no seam to inject a failing collaborator.
RSpec/AnyInstance:
  Exclude:
    - spec/phlex/reactive/deferred_render_job_failure_spec.rb

RSpec/MessageSpies:
  Enabled: false

RSpec/InstanceVariable:
  Exclude:
    - spec/system/**/*

RSpec/DescribeClass:
  Exclude:
    - spec/requests/**/*
    - spec/system/**/*
    # Behavior specs whose subject is a cross-cutting concern (eager loading,
    # vendored-client drift, morph/token/view-context behavior), not a single
    # class — a string subject reads clearer than a forced constant.
    - spec/phlex/eager_load_spec.rb
    - spec/phlex/vendored_controller_sync_spec.rb
    - spec/phlex/reactive/streamable_default_id_spec.rb
    - spec/phlex/reactive/streamable_morph_spec.rb
    - spec/phlex/reactive/streamable_token_spec.rb
    - spec/phlex/reactive/streamable_view_context_spec.rb
    # render.phlex_reactive + broadcast.phlex_reactive are cross-cutting events
    # emitted from several class methods, not one class under test (issue #107).
    - spec/phlex/reactive/instrumentation_spec.rb
    # The defer surface (issue #165) cuts across the module config (token,
    # transport, gates), the Response#defer facade, and the reactive_lazy
    # render interception — string subjects.
    - spec/phlex/reactive/defer_token_spec.rb
    - spec/phlex/reactive/defer_capability_spec.rb
    - spec/phlex/reactive/response_defer_spec.rb
    - spec/phlex/reactive/lazy_mount_spec.rb
    - spec/phlex/reactive/defer_binding_spec.rb
    - spec/phlex/reactive/deferred_render_job_failure_spec.rb
    # url_options threading (issue #232) cuts across the module thread-local,
    # the view-context override, the endpoint, and the broadcast guard.
    - spec/phlex/reactive/url_options_spec.rb

# The `describe Klass, "label"` form uses the second arg as a context label
# (e.g. `describe Component, "reactive_collection"`), not a method name.
RSpec/DescribeMethod:
  Enabled: false

# Group-level local variables (file paths, computed fixtures) referenced inside
# examples are a deliberate, readable setup here — not leaked mutable state.
RSpec/LeakyLocalVariable:
  Enabled: false

#=============
#=== RAKE ===
#=============

# The release task defines small formatting helpers (info/success/skip/header)
# and the bench tasks define inline helpers — intentional, task-local sugar.
Rake/MethodDefinitionInTask:
  Enabled: false

#=============
#=== STYLE ===
#=============

# Modern Ruby idioms — the whole point of moving off Standard: teach and enforce
# the newer ways of writing Ruby.

# Ruby 3.4 implicit single block parameter: enforce `map { it.foo }` over
# `map { |x| x.foo }`. Safe here because the gem floor is Ruby 3.4. `always`
# (not `allow_single_line`, which permits but never enforces) is what actually
# converts the call sites. The gemspec and Rakefile are excluded: their
# `do |spec| … end` / `do |t| … end` config-builder blocks read better named,
# and they contain NESTED blocks where blanket `it` would collapse two distinct
# parameters into one (a silent correctness bug in the cop's autocorrect).
Style/ItBlockParameter:
  EnforcedStyle: always
  Exclude:
    - "*.gemspec"
    - Rakefile
    # Shared byte-identical with daisyui/dash, which still support Ruby 3.2 (no `it`).
    - rakelib/release.rake

Style/Documentation:
  Enabled: false

# Benchmark scripts print fixed-width report columns with positional `%s`/`%d`
# tokens — annotated tokens would only add noise to throwaway output strings.
Style/FormatStringToken:
  Exclude:
    - benchmark/**/*.rb

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: no_comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: no_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: no_comma
